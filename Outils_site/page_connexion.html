<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - GNINOU_FOOD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/connexion.css">
  <link rel="icon" type="image/png" href="../res/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <main>
    <div class="form-container">
      <img src="../res/logo.png" alt="GNINOU_FOOD" class="logo">
      <h1>Connexion</h1>

      <form action="traitement_connexion.php" method="get">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="exemple@gmail.com" required>

        <label for="password">Mot de passe</label>
        <div class="password-container">
          <input type="password" id="password" name="password" placeholder="Mot de passe" required>
          <button type="button" class="toggle-password" id="togglePassword">
            <i class="fa fa-eye"></i>
          </button>
        </div>

        <button type="submit" class="btn">Se connecter</button>
      </form>

      <p class="redirect">
        Pas encore inscrit ? <a href="page_inscription.html">Créez un compte</a>
      </p>
      <p class="redirect">
        <a href="../Page.principale.html">← Retour à l'accueil</a>
      </p>
    </div>
  </main>

  <footer class="pied-page">
    <p>&copy; 2026 GNINOU_FOOD - Tous droits réservés</p>
  </footer>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>
</body>
</html>
