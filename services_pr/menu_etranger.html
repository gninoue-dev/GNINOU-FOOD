<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plats Étrangers — GNINOU_FOOD</title>
  <meta name="description" content="Plats Étrangers : commande en ligne et livraison à Abidjan avec GNINOU_FOOD.">
  <link rel="icon" type="image/png" href="../res/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/commun.css">
  <link rel="stylesheet" href="../css/menu.css">
  <script>try { var t = JSON.parse(localStorage.getItem('gf.theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>

<!-- Page générée à partir de js/donnees.js par js/menu.js -->
<body data-racine="../" data-page="menu-etranger" data-categorie="etranger">

  <main id="contenu">
    <section class="banniere-menu" id="banniereMenu"></section>

    <div class="conteneur">
      <nav class="onglets-menus" id="ongletsMenus" aria-label="Autres menus"></nav>

      <div class="barre-outils" role="search">
        <div class="filtre-recherche">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <label for="filtreTexte" class="visuellement-cache">Filtrer ce menu</label>
          <input type="search" id="filtreTexte" placeholder="Filtrer ce menu...">
        </div>
        <div class="filtres-tags" id="filtresTags" role="group" aria-label="Filtres"></div>
        <div class="filtre-prix">
          <label for="filtrePrix">Prix max : <strong id="valeurPrix"></strong></label>
          <input type="range" id="filtrePrix" step="500">
        </div>
        <div class="filtre-tri">
          <label for="filtreTri" class="visuellement-cache">Trier</label>
          <select id="filtreTri">
            <option value="defaut">Notre sélection</option>
            <option value="prix-croissant">Prix croissant</option>
            <option value="prix-decroissant">Prix décroissant</option>
            <option value="nom">De A à Z</option>
          </select>
        </div>
      </div>

      <p class="compte-resultats" id="compteResultats" aria-live="polite"></p>
      <div class="grille-plats" id="grilleMenu"></div>
    </div>
  </main>

  <script src="../js/donnees.js"></script>
  <script src="../js/commun.js"></script>
  <script src="../js/menu.js"></script>
</body>

</html>
